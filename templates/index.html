<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset=" UTF-8">
    <title>AI Chat</title>

    <style>
        body{
            background: #f5f5f5;
            font-family:Arial;
        }
        .chat-container{
            width: 700px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        #chat-box{
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;

        }

        .message{
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        .user{
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .ai{
            background: #e9e9e9;
        }

        .input-area{
            margin-top: 15px;
            display: flex;
        }

        input{
            flex: 1;
            padding: 10px;
        }

        button{
            width: 100px;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <h2>My AI Chat</h2>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="输入问题..."
        >

        <button onclick="sendQuestion()">
            发送
        </button>

    </div>

</div>

<script>

async function sendQuestion(){

    let q = document.getElementById("question").value

    if(q.trim() === ""){
        return
    }

    let chatBox = document.getElementById("chat-box")

    // 用户消息
    chatBox.innerHTML += `
        <div class="message user">
            ${q}
        </div>
    `

    document.getElementById("question").value = ""

    // AI加载提示
    chatBox.innerHTML += `
        <div class="message ai" id="loading">
            AI思考中...
        </div>
    `

    chatBox.scrollTop = chatBox.scrollHeight

    let response = await fetch(
        `/chat?q=${q}`
    )

    let data = await response.json()

    // 删除加载提示
    document.getElementById("loading").remove()

    // AI消息
    chatBox.innerHTML += `
        <div class="message ai">
            ${data.answer}
        </div>
    `

    chatBox.scrollTop = chatBox.scrollHeight
}

</script>

</body>
</html>
