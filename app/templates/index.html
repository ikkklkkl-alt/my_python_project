<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body class="theme-dark">
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button type="button" class="btn-new-chat" id="btnNewChat" title="新对话">
                    <span class="icon-plus" aria-hidden="true">+</span>
                    新对话
                </button>
                <button type="button" class="btn-icon sidebar-toggle" id="btnCollapseSidebar" title="收起侧栏" aria-label="收起侧栏">«</button>
            </div>
            <div class="session-list" id="sessionList"></div>
            <div class="sidebar-footer">
                <button type="button" class="btn-ghost btn-small" id="btnTheme" title="切换主题">浅色 / 深色</button>
            </div>
        </aside>

        <button type="button" class="fab-sidebar-open" id="btnOpenSidebar" title="打开侧栏" aria-label="打开侧栏">☰</button>

        <main class="main">
            <header class="main-header">
                <h1 class="main-title" id="mainTitle">新对话</h1>
                <div class="main-actions">
                    <button type="button" class="btn-ghost btn-small" id="btnStop" hidden>停止生成</button>
                    <button type="button" class="btn-ghost btn-small" id="btnRename" title="重命名当前对话">重命名</button>
                    <button type="button" class="btn-ghost btn-small danger" id="btnDeleteChat" title="删除当前对话">删除</button>
                </div>
            </header>

            <div class="messages-wrap">
                <div class="messages" id="messages"></div>
            </div>

            <footer class="composer">
                <div class="composer-inner">
                    <textarea id="input" rows="1" placeholder="发送消息…（Shift+Enter 换行）" autocomplete="off"></textarea>
                    <button type="button" class="btn-send" id="btnSend" title="发送 (Enter)">发送</button>
                </div>
                <p class="composer-hint">内容由 AI 生成，请核对事实。会话保存在服务器内存中，重启后会清空。</p>
            </footer>
        </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <div class="modal" id="renameModal" hidden role="dialog" aria-labelledby="renameModalTitle">
        <h2 id="renameModalTitle" class="modal-title">重命名对话</h2>
        <input type="text" class="modal-input" id="renameInput" maxlength="200" placeholder="标题">
        <div class="modal-actions">
            <button type="button" class="btn-ghost" id="renameCancel">取消</button>
            <button type="button" class="btn-send" id="renameSave">保存</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
